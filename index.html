<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 لعبة المافيا</title>

<style>

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    color:white;
    text-align:center;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:750px;
    margin:auto;
    background:rgba(31,41,55,.95);
    padding:25px;
    border-radius:20px;
}

h1{
    color:#ef4444;
}

input{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:10px;
    text-align:center;
}

button{
    padding:12px 18px;
    margin:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#dc2626;
    color:white;
    font-weight:bold;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
    background:#ef4444;
}

.role-card{
    margin-top:20px;
    padding:25px;
    background:#7f1d1d;
    border-radius:15px;
    font-size:28px;
    font-weight:bold;
    border:2px solid #ef4444;
}

.hidden{
    display:none;
}

#playerTurn{
    color:#fbbf24;
}

.eliminated{
    margin-top:10px;
    padding:10px;
    background:#111827;
    border:1px solid #ef4444;
    border-radius:10px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.reset-btn{
    background:#374151;
}

</style>
</head>

<body>

<div class="container">

<!-- 🔁 زر الأعلى -->
<div class="top-bar">
<h3>🎭 Mafia Game</h3>
<button class="reset-btn" onclick="resetGame()">🔁 إعادة اللعبة</button>
</div>

<!-- ===== الإعداد ===== -->
<div id="setupPage">

<label>عدد اللاعبين:</label><br>
<input type="number" id="players" min="4" value="6">

<br>

<div>
<label><input type="checkbox" id="sheikh" checked> شيخ</label>
<label><input type="checkbox" id="girl" checked> بنت</label>
<label><input type="checkbox" id="boy" checked> ولد</label>
</div>

<br>

<label>عدد المافيا:</label><br>
<input type="number" id="mafiaCount" min="1" value="1">

<br><br>

<button onclick="createNameInputs()">➡️ إدخال الأسماء</button>

<div id="nameInputs"></div>

<br>

<button onclick="startGame()">🎲 توزيع الأدوار</button>

</div>

<!-- ===== اللعب ===== -->
<div id="gamePage" class="hidden">

<h1>🎭 الأدوار</h1>

<h2 id="playerTurn"></h2>

<button onclick="showRole()">👁️ كشف الدور</button>

<div id="roleCard" class="role-card hidden"></div>

<br>

<button onclick="nextPlayer()">➡️ اللاعب التالي</button>

</div>

<!-- ===== الإقصاء ===== -->
<div id="summaryPage" class="hidden">

<h1>🗳️ الإقصاء</h1>

<div id="summaryList"></div>

<h2>❌ سجل الإقصاء</h2>
<div id="eliminationLog"></div>

</div>

</div>

<script>

let roles = [];
let names = [];
let currentPlayer = 0;
let roleViewed = false;

/* ===== حفظ ===== */
function saveGame(){
    localStorage.setItem("mafiaGame", JSON.stringify({
        roles,
        names,
        currentPlayer
    }));
}

/* ===== تحميل ===== */
window.onload = function(){

    let saved = localStorage.getItem("mafiaGame");

    if(saved){

        let data = JSON.parse(saved);

        if(!data.roles || data.roles.length === 0) return;

        roles = data.roles;
        names = data.names;
        currentPlayer = data.currentPlayer;

        document.getElementById("setupPage").classList.add("hidden");
        document.getElementById("gamePage").classList.remove("hidden");

        document.getElementById("playerTurn").innerText =
            "👤 الدور: " + (names[currentPlayer] || "لاعب");
    }
};

/* ===== 🔥 RESET FIXED ===== */
function resetGame(){

    let ok = confirm("⚠️ هل أنت متأكد أنك تريد إعادة اللعبة؟");

    if(!ok) return;

    localStorage.removeItem("mafiaGame");

    roles = [];
    names = [];
    currentPlayer = 0;
    roleViewed = false;

    document.getElementById("setupPage").classList.remove("hidden");
    document.getElementById("gamePage").classList.add("hidden");
    document.getElementById("summaryPage").classList.add("hidden");

    document.getElementById("nameInputs").innerHTML = "";
    document.getElementById("eliminationLog").innerHTML = "";
    document.getElementById("summaryList").innerHTML = "";

    document.getElementById("players").value = 6;
    document.getElementById("mafiaCount").value = 1;

    alert("✅ تم إعادة اللعبة");
}

/* ===== إدخال أسماء ===== */
function createNameInputs(){

    let count = document.getElementById("players").value;

    let html = "<h3>✏️ أدخل أسماء اللاعبين</h3>";

    for(let i=0;i<count;i++){
        html += `<input type="text" id="name${i}" placeholder="اسم اللاعب ${i+1}"><br>`;
    }

    document.getElementById("nameInputs").innerHTML = html;
}

/* ===== خلط ===== */
function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

/* ===== بدء اللعبة ===== */
function startGame(){

    let players = parseInt(document.getElementById("players").value);
    let mafiaCount = parseInt(document.getElementById("mafiaCount").value);

    names = [];

    for(let i=0;i<players;i++){

        let input = document.getElementById("name"+i);

        let nameValue = input && input.value.trim() !== ""
            ? input.value.trim()
            : "لاعب " + (i+1);

        names.push(nameValue);
    }

    let rolesList = [];

    if(document.getElementById("sheikh").checked) rolesList.push("🕌 شيخ");
    if(document.getElementById("girl").checked) rolesList.push("👧 بنت");
    if(document.getElementById("boy").checked) rolesList.push("👦 ولد");

    for(let i=0;i<mafiaCount;i++){
        rolesList.push("🔪 مافيا");
    }

    while(rolesList.length < players){
        rolesList.push("🙂 مواطن");
    }

    shuffle(rolesList);

    roles = rolesList.map(r => ({
        role: r,
        alive: true
    }));

    currentPlayer = 0;
    roleViewed = false;

    document.getElementById("setupPage").classList.add("hidden");
    document.getElementById("gamePage").classList.remove("hidden");

    document.getElementById("playerTurn").innerText =
        "👤 الدور: " + names[0];

    saveGame();
}

/* ===== كشف الدور ===== */
function showRole(){

    document.getElementById("roleCard").innerText =
        roles[currentPlayer].role;

    document.getElementById("roleCard").classList.remove("hidden");

    roleViewed = true;
}

/* ===== التالي ===== */
function nextPlayer(){

    if(!roleViewed){
        alert("⚠️ لازم تكشف الدور أولاً");
        return;
    }

    roleViewed = false;
    currentPlayer++;

    if(currentPlayer >= roles.length){
        showSummary();
        return;
    }

    document.getElementById("playerTurn").innerText =
        "👤 الدور: " + names[currentPlayer];

    document.getElementById("roleCard").classList.add("hidden");

    saveGame();
}

/* ===== الإقصاء ===== */
function showSummary(){

    document.getElementById("gamePage").classList.add("hidden");
    document.getElementById("summaryPage").classList.remove("hidden");

    render();
}

function render(){

    let html = "";

    for(let i=0;i<roles.length;i++){

        if(!roles[i].alive) continue;

        html += `
            <button onclick="eliminate(${i})">
                👤 ${names[i]}
            </button>
        `;
    }

    document.getElementById("summaryList").innerHTML = html;
}

/* ===== حذف لاعب ===== */
function eliminate(i){

    roles[i].alive = false;

    render();

    let log = document.getElementById("eliminationLog");

    let div = document.createElement("div");
    div.className = "eliminated";
    div.innerText = "❌ تم إقصاء: " + names[i] + " (" + roles[i].role + ")";

    log.appendChild(div);

    saveGame();
}

</script>

</body>
</html>
