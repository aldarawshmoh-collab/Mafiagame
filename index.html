<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة المافيا</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:#1f2937;
    padding:20px;
    border-radius:15px;
}

input, button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
}

button{
    cursor:pointer;
    background:#2563eb;
    color:white;
}

.role-card{
    margin-top:20px;
    padding:20px;
    background:#374151;
    border-radius:12px;
    font-size:28px;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>🎭 توزيع أدوار المافيا</h1>

<label>عدد اللاعبين:</label>
<input type="number" id="players" min="4" value="6">

<br>

<label>
<input type="checkbox" id="sheikh" checked>
شيخ
</label>

<label>
<input type="checkbox" id="girl" checked>
بنت
</label>

<label>
<input type="checkbox" id="boy" checked>
ولد
</label>

<br><br>

<label>عدد المافيا:</label>
<input type="number" id="mafiaCount" min="1" value="1">

<br><br>

<button onclick="generateRoles()">
توزيع الأدوار
</button>

<div id="gameArea" class="hidden">

<h2 id="playerTurn"></h2>

<button onclick="showRole()">
كشف دوري
</button>

<div id="roleCard" class="role-card hidden"></div>

<br>

<button onclick="nextPlayer()">
اللاعب التالي
</button>

</div>

</div>

<script>

let roles = [];
let currentPlayer = 0;

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function generateRoles(){

    let players = parseInt(document.getElementById("players").value);
    let mafiaCount = parseInt(document.getElementById("mafiaCount").value);

    let rolesList = [];

    if(document.getElementById("sheikh").checked)
        rolesList.push("🕌 الشيخ");

    if(document.getElementById("girl").checked)
        rolesList.push("👧 البنت");

    if(document.getElementById("boy").checked)
        rolesList.push("👦 الولد");

    for(let i=0;i<mafiaCount;i++){
        rolesList.push("🔪 مافيا");
    }

    if(rolesList.length > players){
        alert("عدد الأدوار الخاصة أكبر من عدد اللاعبين!");
        return;
    }

    while(rolesList.length < players){
        rolesList.push("🙂 مواطن");
    }

    shuffle(rolesList);

    roles = rolesList;
    currentPlayer = 0;

    document.getElementById("gameArea").classList.remove("hidden");
    document.getElementById("playerTurn").innerText =
        "اللاعب رقم 1";

    document.getElementById("roleCard").classList.add("hidden");
}

function showRole(){

    let card = document.getElementById("roleCard");

    card.innerText = roles[currentPlayer];
    card.classList.remove("hidden");
}

function nextPlayer(){

    currentPlayer++;

    if(currentPlayer >= roles.length){

        document.getElementById("playerTurn").innerText =
            "✅ انتهى توزيع الأدوار";

        document.getElementById("roleCard").innerText =
            "ابدأوا اللعبة";

        return;
    }

    document.getElementById("playerTurn").innerText =
        "اللاعب رقم " + (currentPlayer+1);

    document.getElementById("roleCard").classList.add("hidden");
}

</script>

</body>
</html>
